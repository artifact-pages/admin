# Deploy the web app pinned by the admin Action's version. Deployment is always
# an explicit run: upgrading the Action ref alone never deploys the app.
name: App deploy

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Plan only, without writes.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: app-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Deploy the pinned web app
        uses: artifact-pages/app-deploy-action@v0.1.0
        with:
          dry-run: ${{ inputs.dry-run }}
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
