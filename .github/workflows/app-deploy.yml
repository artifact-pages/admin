# Deploy the web app pinned by the admin Action's version. Deployment is always
# an explicit run: upgrading the Action ref alone never deploys the app.
name: App deploy

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Plan only, without writes.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: app-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy the pinned web app
        id: deploy
        uses: tasuku43/git-artifact-pages/actions/admin@v0.1.2
        with:
          operation: app-deploy
          config: artifact-pages.yaml
          dry-run: ${{ inputs.dry-run }}
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      - name: Summarize
        env:
          OUTCOME: ${{ steps.deploy.outputs.outcome }}
          CHANGES: ${{ steps.deploy.outputs.changes_json }}
        run: |
          echo "### App deploy: $OUTCOME ($(jq length <<<"$CHANGES") object changes)" >> "$GITHUB_STEP_SUMMARY"
