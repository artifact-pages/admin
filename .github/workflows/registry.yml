# Reconcile the production registry with artifact-pages.yaml.
# Pull requests get a dry-run plan; merges to main apply it.
name: Registry

on:
  pull_request:
    paths: [artifact-pages.yaml]
  push:
    branches: [main]
    paths: [artifact-pages.yaml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-24.04
    steps:
      - name: Register the complete site set
        uses: tasuku43/git-artifact-pages/actions/admin@v0.2.0
        with:
          operation: registry-register
          # Real registry write on main only; pull requests are a dry-run.
          publish-on: |
            push:refs/heads/main
            workflow_dispatch:refs/heads/main
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
