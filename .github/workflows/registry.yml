# Reconcile the production registry with artifact-pages.yaml.
# Pull requests get a dry-run plan. During the initial release rollout, main
# pushes stay dry-run; a workflow_dispatch on main remains the manual write path.
name: Registry

on:
  pull_request:
    paths: [artifact-pages.yaml]
  push:
    branches: [main]
    paths: [artifact-pages.yaml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-24.04
    # Credentials are scoped to the production environment; pull requests run
    # without it (dry-run).
    environment: ${{ github.event_name != 'pull_request' && 'production' || '' }}
    steps:
      - name: Register the complete site set
        uses: artifact-pages/registry-action@c5edcfaa4ae9a479cb52b3489daa8925cf5eec29 # v0.1.0
        with:
          # Hold automatic registry writes until the rollout has been accepted.
          publish-on: |
            workflow_dispatch:refs/heads/main
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
